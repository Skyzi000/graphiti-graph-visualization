[project]
name = "graphiti-graph-service"
version = "0.1.0"
description = "FastAPI implementation of the Graphiti Graph Service MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.2,<2.10",
    "python-dotenv>=1.0.1",
    "graphiti-core[falkordb]>=0.11.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0"
]

[tool.uvicorn]
factory = false
app = "graphiti_service.main:app"
reload = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
