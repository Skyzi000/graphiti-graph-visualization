services:
  graphiti-service:
    build:
      context: ./graphiti_service
      dockerfile: Dockerfile
    environment:
      GRAPHITI_ALLOW_ORIGINS: "*"
      GRAPHITI_NEO4J_URI: ${GRAPHITI_NEO4J_URI}
      GRAPHITI_NEO4J_USER: ${GRAPHITI_NEO4J_USER}
      GRAPHITI_NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD}

  viewer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      GRAPHITI_SERVICE_URL: http://graphiti-service:8000
      GRAPHITI_USE_SAMPLE_DATA: "false"
    depends_on:
      - graphiti-service
    ports:
      - "3000:3000"
