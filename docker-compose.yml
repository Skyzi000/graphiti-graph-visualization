services:
  graphiti-service:
    build:
      context: ./graphiti_service
      dockerfile: Dockerfile
    environment:
      GRAPHITI_ALLOW_ORIGINS: "*"
      # ドライバー選択: neo4j または falkordb
      GRAPHITI_DRIVER: ${GRAPHITI_DRIVER:-neo4j}
      # Neo4j 接続情報
      GRAPHITI_NEO4J_URI: ${GRAPHITI_NEO4J_URI:-bolt://localhost:7687}
      GRAPHITI_NEO4J_USER: ${GRAPHITI_NEO4J_USER:-neo4j}
      GRAPHITI_NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD:-}
      # FalkorDB 接続情報
      GRAPHITI_FALKORDB_HOST: ${GRAPHITI_FALKORDB_HOST:-localhost}
      GRAPHITI_FALKORDB_PORT: ${GRAPHITI_FALKORDB_PORT:-6379}
      GRAPHITI_FALKORDB_USER: ${GRAPHITI_FALKORDB_USER:-}
      GRAPHITI_FALKORDB_PASSWORD: ${GRAPHITI_FALKORDB_PASSWORD:-}
      GRAPHITI_FALKORDB_DATABASE: ${GRAPHITI_FALKORDB_DATABASE:-}

  viewer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      GRAPHITI_SERVICE_URL: http://graphiti-service:8000
      GRAPHITI_USE_SAMPLE_DATA: "false"
    depends_on:
      - graphiti-service
    ports:
      - "3000:3000"
